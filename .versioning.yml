branches:
    hotfix_targets:
        - sandbox-23
    tag_on: sandbox-23
changelog:
    commit_url: https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit
    include_author: true
    include_commit_link: true
    include_ticket_link: false
commits:
    format: conventional
hotfix:
    keyword:
        - hotfix:*
        - hotfix(*
        - '[Hh]otfix/*'
validation:
    hotfix_title_required: warn
version:
    components:
        epoch:
            enabled: false
            initial: 0
        hotfix_counter:
            enabled: true
            initial: 0
        major:
            enabled: true
            initial: 23
        patch:
            enabled: true
            initial: 0
    tag_prefix_v: true
