commits:
  format: conventional
version:
  tag_prefix_v: true
  components:
    epoch:
      enabled: false
      initial: 0
    major:
      enabled: true
      initial: 23
    patch:
      enabled: true
      initial: 0
    hotfix_counter:
      enabled: true
      initial: 0
branches:
  tag_on: sandbox-23
  hotfix_targets:
  - sandbox-23
hotfix:
  keyword:
  - hotfix:*
  - hotfix(*
  - '[Hh]otfix/*'
changelog:
  commit_url: https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit
  include_author: true
  include_commit_link: true
  include_ticket_link: false
validation:
  hotfix_title_required: warn
