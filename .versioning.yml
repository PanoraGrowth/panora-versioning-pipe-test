branches:
    development: sandbox-14
    hotfix_targets:
        - sandbox-14
    production: sandbox-14
    tag_on: sandbox-14
changelog:
    commit_url: https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit
    include_author: true
    include_commit_link: true
    include_ticket_link: false
    mode: full
    per_folder:
        enabled: true
        fallback: file_path
        folders:
            - backend
            - frontend
        scope_matching: exact
commits:
    format: conventional
hotfix:
    keyword:
        - hotfix:*
        - hotfix(*
        - '[Hh]otfix/*'
version:
    components:
        epoch:
            enabled: false
            initial: 0
        hotfix_counter:
            enabled: true
            initial: 0
        major:
            enabled: true
            initial: 14
        patch:
            enabled: true
            initial: 0
    tag_prefix_v: true
