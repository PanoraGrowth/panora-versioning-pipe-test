commits:
  format: conventional
version:
  tag_prefix_v: true
  components:
    epoch:
      enabled: false
    major:
      enabled: true
      initial: 25
    patch:
      enabled: true
      initial: 0
    hotfix_counter:
      enabled: true
      initial: 0
    timestamp:
      enabled: false
branches:
  tag_on: sandbox-25
  hotfix_targets:
  - sandbox-25
hotfix:
  keyword:
  - hotfix:*
  - hotfix(*
  - '[Hh]otfix/*'
changelog:
  mode: full
  commit_url: https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit
  include_author: true
  include_commit_link: true
  include_ticket_link: false

