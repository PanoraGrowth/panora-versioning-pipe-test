branches:
    development: sandbox-29
    hotfix_targets:
        - sandbox-29
    production: sandbox-29
    tag_on: sandbox-29
changelog:
    commit_url: https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit
    include_author: true
    include_commit_link: true
    include_ticket_link: false
    mode: full
    per_folder:
        enabled: false
commits:
    format: conventional
hotfix:
    keyword:
        - URGENT-PATCH
version:
    components:
        epoch:
            enabled: false
            initial: 0
        hotfix_counter:
            enabled: true
            initial: 0
        major:
            enabled: true
            initial: 29
        patch:
            enabled: true
            initial: 0
    tag_prefix_v: true
