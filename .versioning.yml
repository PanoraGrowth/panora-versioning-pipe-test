branches:
    development: sandbox-13
    hotfix_targets:
        - sandbox-13
    production: sandbox-13
    tag_on: sandbox-13
changelog:
    commit_url: https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit
    include_author: true
    include_commit_link: true
    include_ticket_link: false
    mode: full
    per_folder:
        enabled: true
        fallback: file_path
        folders:
            - backend
            - frontend
        scope_matching: exact
commits:
    format: conventional
hotfix:
    keyword:
        - ^hotfix(\(|:)
        - ^[Hh]otfix/
        - URGENT-PATCH
version:
    components:
        epoch:
            enabled: false
            initial: 0
        hotfix_counter:
            enabled: true
            initial: 0
        major:
            enabled: true
            initial: 13
        patch:
            enabled: true
            initial: 0
    tag_prefix_v: true
