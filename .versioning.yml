# .versioning.yml - Test configuration for GitHub Actions
# Using ticket format with Jira integration

commits:
  format: "ticket"

tickets:
  prefixes:
    - "KAN"
  required: true
  url: "https://panoragrowth.atlassian.net/browse"

version:
  tag_prefix_v: true
  components:
    period:
      enabled: true
      initial: 0
    major:
      enabled: true
      initial: 1
    minor:
      enabled: true
      initial: 0
    timestamp:
      enabled: false

changelog:
  title: "Changelog"
  commit_url: "https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit"
  ticket_link_label: "View in Jira"

branches:
  development: "development"
  production: "main"
  tag_on: "development"

notifications:
  teams:
    enabled: false
