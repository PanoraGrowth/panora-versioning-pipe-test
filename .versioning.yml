branches:
    development: main
    hotfix_targets:
        - main
        - pre-production
    production: main
    tag_on: main
changelog:
    commit_url: https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit
    include_author: true
    include_commit_link: true
    include_ticket_link: false
    mode: full
    per_folder:
        enabled: true
        fallback: file_path
        folders:
            - backend
            - frontend
        scope_matching: exact
commits:
    format: conventional
hotfix:
    keyword:
        - hotfix:*
        - hotfix(*
        - '[Hh]otfix/*'
version:
    components:
        epoch:
            enabled: true
        hotfix_counter:
            enabled: true
        major:
            enabled: true
        minor:
            enabled: true
        patch:
            enabled: true
            initial: 0
        timestamp:
            enabled: false
    tag_prefix_v: true
