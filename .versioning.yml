commits:
  format: conventional
version:
  tag_prefix_v: true
  components:
    epoch:
      enabled: false
      initial: 0
    major:
      enabled: true
      initial: 5
    patch:
      enabled: true
      initial: 0
    hotfix_counter:
      enabled: true
      initial: 0
branches:
  development: sandbox-05
  production: sandbox-05
  tag_on: sandbox-05
  hotfix_targets:
  - sandbox-05
hotfix:
  keyword:
  - '^hotfix(\(|:)'
  - '^[Hh]otfix/'
  - 'URGENT-PATCH'
changelog:
  mode: full
  commit_url: https://github.com/PanoraGrowth/panora-versioning-pipe-test/commit
  include_author: true
  include_commit_link: true
  include_ticket_link: false
  per_folder:
    enabled: true
    folders:
    - backend
    - frontend
    scope_matching: exact
    fallback: file_path