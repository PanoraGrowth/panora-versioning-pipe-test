# Reusable versioning workflow
# Runs panora-versioning-pipe Docker image with the provided context
#
# Image tag controlled by the image_tag input.
# Defaults to the org-level variable VERSIONING_PIPE_TAG.

name: Run Versioning Pipe

on:
  workflow_call:
    inputs:
      pr_id:
        description: "Pull request ID (empty for branch pipeline)"
        required: false
        type: string
        default: ""
      branch:
        description: "Current branch name"
        required: true
        type: string
      target_branch:
        description: "PR target branch (required for PR pipeline)"
        required: false
        type: string
        default: ""
      commit:
        description: "Commit SHA"
        required: true
        type: string
      image_tag:
        description: "Pipe image tag to use (default: org VERSIONING_PIPE_TAG variable)"
        required: false
        type: string
        default: ""

jobs:
  versioning:
    name: Versioning Pipe
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/panoragrowth/panora-versioning-pipe:${{ inputs.image_tag || vars.VERSIONING_PIPE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run versioning pipe
        run: /pipe/pipe.sh
        env:
          VERSIONING_PR_ID: ${{ inputs.pr_id }}
          VERSIONING_BRANCH: ${{ inputs.branch }}
          VERSIONING_TARGET_BRANCH: ${{ inputs.target_branch }}
          VERSIONING_COMMIT: ${{ inputs.commit }}