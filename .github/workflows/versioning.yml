# Versioning pipe — PR validation + tag-on-merge
#
# Image tag controlled by org-level variable VERSIONING_PIPE_TAG.
# Override with image_tag input for preview image testing.

name: Versioning

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Pipe image tag to use (default: org VERSIONING_PIPE_TAG variable)"
        required: false
        type: string
        default: ""
  pull_request:
    branches:
      - main
      - 'sandbox-*'
  push:
    branches:
      - main
      - 'sandbox-*'

permissions:
  contents: write

jobs:
  versioning:
    name: Versioning Pipe
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/panoragrowth/panora-versioning-pipe:${{ inputs.image_tag || vars.VERSIONING_PIPE_TAG }}
    steps:
      - name: Generate CI token
        id: ci-token
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          token: ${{ steps.ci-token.outputs.token || github.token }}

      - name: Run versioning pipe
        run: /pipe/pipe.sh
        env:
          CI_GITHUB_TOKEN: ${{ steps.ci-token.outputs.token || '' }}
