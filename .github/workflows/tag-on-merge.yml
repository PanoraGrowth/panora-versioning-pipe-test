# Tag on merge — create version tag + CHANGELOG when PR merges to main
# Uses GitHub App token for pushing commits to protected branches
#
# Image tag controlled by org-level variable VERSIONING_PIPE_TAG.
# Override with image_tag input for preview image testing.

name: Main - Create Version Tag

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Pipe image tag to use (default: org VERSIONING_PIPE_TAG variable)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-token:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.ci-token.outputs.token }}
    steps:
      - name: Generate CI token
        id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  versioning:
    needs: generate-token
    uses: ./.github/workflows/run-versioning.yml
    with:
      branch: main
      commit: ${{ github.sha }}
      image_tag: ${{ inputs.image_tag || '' }}
    secrets:
      GITHUB_TOKEN: ${{ needs.generate-token.outputs.token }}