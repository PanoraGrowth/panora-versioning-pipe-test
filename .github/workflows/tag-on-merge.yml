# Tag on merge — create version tag + CHANGELOG when PR merges to main
# Copy of panora-versioning-pipe/examples/github-actions/tag-on-merge.yml

name: Main - Create Version Tag

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Generate CI token
        id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.ci-token.outputs.token }}

      # Image tag controlled by org-level variable VERSIONING_PIPE_TAG.
      # Override at repo level to pin a specific version.
      # NOTE: uses: docker:// does not support ${{ vars.* }} expressions,
      # so we use docker run instead.
      - name: Run versioning pipe
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            -e GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e CI_GITHUB_TOKEN="${CI_GITHUB_TOKEN}" \
            "public.ecr.aws/k5n8p2t3/panora-versioning-pipe:${VERSIONING_PIPE_TAG}"
        env:
          VERSIONING_PIPE_TAG: ${{ vars.VERSIONING_PIPE_TAG }}
          CI_GITHUB_TOKEN: ${{ steps.ci-token.outputs.token }}
