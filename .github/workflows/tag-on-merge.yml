# Tag on merge — create version tag + CHANGELOG when PR merges to main or sandbox branches
# Uses GitHub App token for pushing commits to protected branches
#
# Image tag controlled by org-level variable VERSIONING_PIPE_TAG.
# Override with image_tag input for preview image testing.

name: Main - Create Version Tag

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Pipe image tag to use (default: org VERSIONING_PIPE_TAG variable)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
      - 'sandbox-*'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/panoragrowth/panora-versioning-pipe:${{ inputs.image_tag || vars.VERSIONING_PIPE_TAG }}
    steps:
      - name: Generate CI token
        id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ steps.ci-token.outputs.token }}

      - name: Run versioning pipe
        run: /pipe/pipe.sh
        env:
          CI_GITHUB_TOKEN: ${{ steps.ci-token.outputs.token }}
