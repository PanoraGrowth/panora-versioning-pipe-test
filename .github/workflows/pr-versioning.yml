# PR Versioning — validate commits and generate CHANGELOG
# Copy of panora-versioning-pipe/examples/github-actions/pr-versioning.yml

name: PR - Versioning

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  versioning:
    name: Versioning Pipe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      # Image tag controlled by org-level variable VERSIONING_PIPE_TAG.
      # Override at repo level to pin a specific version.
      - name: Run versioning pipe
        uses: docker://public.ecr.aws/k5n8p2t3/panora-versioning-pipe:${{ vars.VERSIONING_PIPE_TAG }}
