# PR Versioning — validate commits and generate CHANGELOG
# Copy of panora-versioning-pipe/examples/github-actions/pr-versioning.yml

name: PR - Versioning

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  versioning:
    name: Versioning Pipe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      # Image tag controlled by org-level variable VERSIONING_PIPE_TAG.
      # Override at repo level to pin a specific version.
      # NOTE: uses: docker:// does not support ${{ vars.* }} expressions,
      # so we use docker run instead.
      - name: Run versioning pipe
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            -e GITHUB_HEAD_REF="${GITHUB_HEAD_REF}" \
            -e GITHUB_BASE_REF="${GITHUB_BASE_REF}" \
            -e GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e GITHUB_EVENT_PATH=/github_event.json \
            -v "${GITHUB_EVENT_PATH}":/github_event.json:ro \
            "public.ecr.aws/k5n8p2t3/panora-versioning-pipe:${VERSIONING_PIPE_TAG}"
        env:
          VERSIONING_PIPE_TAG: ${{ vars.VERSIONING_PIPE_TAG }}
